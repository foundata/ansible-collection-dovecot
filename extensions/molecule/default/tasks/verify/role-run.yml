  ansible.builtin.stat:
    path: "/usr/local/bin/dovecot-quota-warning.sh"
  register: __testing_quotawarning_stat


- name: "Molecule | Verify | Assert the quota-warning script exists, is executable, and references the platform dovecot-lda path"
  ansible.builtin.assert:
    that:
      - __testing_quotawarning_stat['stat']['exists']
      - __testing_quotawarning_stat['stat']['executable']
      - __testing_quotawarning_stat['stat']['mode'] == '0755'
    fail_msg: >-
      The quota-warning script is missing or has unexpected mode/perms:
      {{ __testing_quotawarning_stat['stat'] | ansible.builtin.default({}) }}
    success_msg: "The quota-warning script exists at '/usr/local/bin/dovecot-quota-warning.sh' with mode 0755."


- name: "Molecule | Verify | Read quota-warning script content"
  ansible.builtin.slurp:
    src: "/usr/local/bin/dovecot-quota-warning.sh"
  register: __testing_quotawarning_content


- name: "Molecule | Verify | Assert quota-warning script references the platform-specific dovecot-lda path and Subject"
  ansible.builtin.assert:
    that:
      - __run_dovecot_dovecot_lda_exec_path in (__testing_quotawarning_content['content'] | ansible.builtin.b64decode)
      - "'Subject: Quota warning' in (__testing_quotawarning_content['content'] | ansible.builtin.b64decode)"
    fail_msg: >-
      The quota-warning script is missing the platform-specific dovecot-lda path
      ('{{ __run_dovecot_dovecot_lda_exec_path }}') or the rendered Subject header. Content:
      {{ __testing_quotawarning_content['content'] | ansible.builtin.b64decode }}
    success_msg: >-
      The quota-warning script references the expected dovecot-lda path
      ('{{ __run_dovecot_dovecot_lda_exec_path }}') and the rendered Subject header.


- name: "Molecule | Verify | Assert quota-warning script uses the Dovecot 2.4 no-enforcement override (not the removed 2.3 syntax)"
  ansible.builtin.assert:
    that:
      - "'-o quota_enforce=no' in (__testing_quotawarning_content['content'] | ansible.builtin.b64decode)"
      # the option form of the removed 2.3 override; the plain string also
      # appears in an explanatory template comment, so match the "-o" usage
      - "'-o \"plugin/quota' not in (__testing_quotawarning_content['content'] | ansible.builtin.b64decode)"
    fail_msg: >-
      The quota-warning script does not deliver via 'dovecot-lda -o quota_enforce=no'. The former
      2.3 'plugin/quota=...:noenforcing' override is silently ignored by Dovecot 2.4, so the
      warning mail would be rejected exactly when the mailbox is full. Content:
      {{ __testing_quotawarning_content['content'] | ansible.builtin.b64decode }}
    success_msg: "The quota-warning script disables quota enforcement via the Dovecot 2.4 'quota_enforce=no' override."


## Configuration validity (doveconf -n round-trip)

- name: "Molecule | Verify | Validate the overall Dovecot configuration with doveconf -n"
  ansible.builtin.command:
    argv:
      - "{{ __run_dovecot_doveconf_exec_path }}"
      - "-n"
  register: __testing_doveconf_result
  changed_when:
    - false
  failed_when:
    - __testing_doveconf_result is ansible.builtin.failed


- name: "Molecule | Verify | Assert doveconf -n succeeded and reports our protocols and TLS settings"
  ansible.builtin.assert:
    that:
      - __testing_doveconf_result is ansible.builtin.success
      - "'imap' in __testing_doveconf_result['stdout']"
      - "'lmtp' in __testing_doveconf_result['stdout']"
      # TLS is enabled and points at the dummy cert/key created during prepare.
      # Dovecot 2.4 uses ssl_server_cert_file / ssl_server_key_file (not the old
      # ssl_cert / ssl_key with a leading "<").
      - "'ssl = yes' in __testing_doveconf_result['stdout']"
      - __testing_dovecot_ssl_cert_path in __testing_doveconf_result['stdout']
      - __testing_dovecot_ssl_key_path in __testing_doveconf_result['stdout']
    fail_msg: >-
      doveconf -n failed or reported unexpected output.
      stdout: {{ __testing_doveconf_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_doveconf_result['stderr'] | ansible.builtin.default('') }}
    success_msg: "doveconf -n succeeded and reports the expected protocols and TLS settings."


## TLS: real handshakes against the running service
#
# Prove that Dovecot actually serves TLS with our dummy certificate, both as
# implicit TLS (IMAPS, port 993) and via STARTTLS on the plain IMAP port (143).
# We use `openssl s_client` and feed an IMAP LOGOUT on stdin so the client
# terminates cleanly after the handshake. The certificate subject we set during
# prepare ("SomeOrganization") only shows up if the handshake got far enough to
# exchange the server certificate, so its presence is our TLS proof.

- name: "Molecule | Verify | Set openssl executable path"
  ansible.builtin.set_fact:
    __testing_openssl_executable: "/usr/bin/openssl"


- name: "Molecule | Verify | TLS handshake (implicit IMAPS on 993)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:993"
      - "-crlf"
    stdin: "a1 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_imaps_result


- name: "Molecule | Verify | Assert the implicit IMAPS (993) handshake presented our dummy cert"
  ansible.builtin.assert:
    that:
      - "'CONNECTED' in (__testing_imaps_result['stdout'] ~ __testing_imaps_result['stderr'])"
      - "'SomeOrganization' in (__testing_imaps_result['stdout'] ~ __testing_imaps_result['stderr'])"
      - "'Verify return code' in (__testing_imaps_result['stdout'] ~ __testing_imaps_result['stderr'])"
    fail_msg: >-
      Implicit TLS on port 993 did not complete a handshake presenting the dummy
      certificate.
      stdout: {{ __testing_imaps_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_imaps_result['stderr'] | ansible.builtin.default('') }}
    success_msg: "Implicit IMAPS (993) completed a TLS handshake serving the dummy certificate."


- name: "Molecule | Verify | TLS handshake (STARTTLS on plain IMAP 143)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:143"
      - "-starttls"
      - "imap"
      - "-crlf"
    stdin: "a1 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_imap_starttls_result


- name: "Molecule | Verify | Assert the IMAP STARTTLS (143) handshake presented our dummy cert"
  ansible.builtin.assert:
    that:
      - "'CONNECTED' in (__testing_imap_starttls_result['stdout'] ~ __testing_imap_starttls_result['stderr'])"
      - "'SomeOrganization' in (__testing_imap_starttls_result['stdout'] ~ __testing_imap_starttls_result['stderr'])"
      - "'Verify return code' in (__testing_imap_starttls_result['stdout'] ~ __testing_imap_starttls_result['stderr'])"
    fail_msg: >-
      STARTTLS on the plain IMAP port 143 did not complete a handshake presenting
      the dummy certificate.
      stdout: {{ __testing_imap_starttls_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_imap_starttls_result['stderr'] | ansible.builtin.default('') }}
    success_msg: "IMAP STARTTLS (143) completed a TLS handshake serving the dummy certificate."


## Functional: real IMAP login + LMTP delivery against the passwd-file user
#
# These go beyond "the service is up": they prove authentication actually works
# (a real LOGIN with the passwd-file passdb) and that mail can be delivered and
# is retrievable (LMTP -> userdb -> Maildir).

- name: "Molecule | Verify | IMAP LOGIN + ACL/QUOTA commands over implicit TLS (993)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:993"
      - "-quiet"
      - "-crlf"
    # IMAP dialog: log in, then issue GETQUOTAROOT (needs quota + imap_quota
    # loaded) and MYRIGHTS (needs acl + imap_acl loaded), then log out. -crlf
    # turns these LFs into CRLFs; -quiet drops the handshake noise so stdout
    # carries the IMAP responses (incl. the LOGIN CAPABILITY list).
    stdin: "a1 LOGIN {{ __testing_dovecot_imap_user }} {{ __testing_dovecot_imap_password }}\na2 GETQUOTAROOT INBOX\na3 MYRIGHTS INBOX\na4 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_imap_login_result


- name: "Molecule | Verify | Assert the IMAP LOGIN and imap-side plugins work"
  ansible.builtin.assert:
    that:
      - "'a1 OK' in __testing_imap_login_result['stdout']"
      # the LOGIN CAPABILITY advertises ACL + QUOTA -> acl/imap_acl and
      # quota/imap_quota plugins are loaded for the imap process
      - "'ACL' in __testing_imap_login_result['stdout']"
      - "'QUOTA' in __testing_imap_login_result['stdout']"
      # GETQUOTAROOT succeeds and reports the quota root (quota + imap_quota)
      - "'a2 OK' in __testing_imap_login_result['stdout']"
      - "'QUOTAROOT' in __testing_imap_login_result['stdout']"
      # MYRIGHTS succeeds (acl + imap_acl)
      - "'a3 OK' in __testing_imap_login_result['stdout']"
    fail_msg: >-
      IMAP LOGIN / ACL / QUOTA as '{{ __testing_dovecot_imap_user }}' over TLS
      (993) did not behave as expected.
      stdout: {{ __testing_imap_login_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_imap_login_result['stderr'] | ansible.builtin.default('') }}
    success_msg: >-
      IMAP LOGIN as '{{ __testing_dovecot_imap_user }}' over TLS (993) succeeded and the
      acl/imap_acl + quota/imap_quota plugins are working (CAPABILITY, GETQUOTAROOT, MYRIGHTS).


- name: "Molecule | Verify | Deliver a test message via LMTP (unix socket)"
  ansible.builtin.command:
    argv:
      - "/usr/bin/python3"
      - "-c"
      # Raw LMTP dialog over the unix socket. LMTP needs LHLO (not EHLO), so we
      # speak it directly instead of via smtplib. The server returns one reply
      # per recipient after the final ".".
      - |
        import socket, sys
        sock_path, rcpt = sys.argv[1], sys.argv[2]
        s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
        s.settimeout(15)
        s.connect(sock_path)
        f = s.makefile("rwb")
        def resp():
            while True:
                line = f.readline().decode(errors="replace")
                if not line:
                    raise SystemExit("connection closed unexpectedly")
                if len(line) >= 4 and line[3] == " ":
                    return line[:3], line.rstrip()
        def send(cmd):
            f.write((cmd + "\r\n").encode()); f.flush()
        code, text = resp(); assert code == "220", text
        send("LHLO molecule.test"); code, text = resp(); assert code == "250", text
        send("MAIL FROM:<molecule@molecule.test>"); code, text = resp(); assert code == "250", text
        send("RCPT TO:<%s>" % rcpt); code, text = resp(); assert code == "250", text
        send("DATA"); code, text = resp(); assert code == "354", text
        f.write(
            b"Subject: molecule LMTP delivery check\r\n"
            b"From: molecule@molecule.test\r\n"
            b"To: " + rcpt.encode() + b"\r\n\r\n"
            b"Hello from the molecule LMTP delivery check.\r\n.\r\n"
        ); f.flush()
        code, text = resp(); assert code == "250", text
        send("QUIT")
        print("LMTP-DELIVERED-OK")
      - "{{ __testing_dovecot_lmtp_socket }}"
      - "{{ __testing_dovecot_imap_user }}"
  changed_when: true
  register: __testing_lmtp_deliver_result


- name: "Molecule | Verify | Assert LMTP delivery reported success"
  ansible.builtin.assert:
    that:
      - __testing_lmtp_deliver_result is ansible.builtin.success
      - "'LMTP-DELIVERED-OK' in __testing_lmtp_deliver_result['stdout']"
    fail_msg: >-
      LMTP delivery to '{{ __testing_dovecot_imap_user }}' via
      '{{ __testing_dovecot_lmtp_socket }}' failed.
      stdout: {{ __testing_lmtp_deliver_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_lmtp_deliver_result['stderr'] | ansible.builtin.default('') }}
    success_msg: "LMTP delivery to '{{ __testing_dovecot_imap_user }}' succeeded."


- name: "Molecule | Verify | Query the mailbox state with doveadm"
  ansible.builtin.command:
    argv:
      - "{{ __run_dovecot_doveadm_exec_path }}"
      - "mailbox"
      - "status"
      - "-u"
      - "{{ __testing_dovecot_imap_user }}"
      - "messages"
      - "INBOX"
  changed_when: false
  register: __testing_doveadm_status


- name: "Molecule | Verify | Assert the delivered message is in the mailbox"
  ansible.builtin.assert:
    that:
      - __testing_doveadm_status is ansible.builtin.success
      - "'messages=' in __testing_doveadm_status['stdout']"
      - "'messages=0' not in __testing_doveadm_status['stdout']"
    fail_msg: >-
      The mailbox of '{{ __testing_dovecot_imap_user }}' does not contain the
      delivered message. doveadm: {{ __testing_doveadm_status['stdout'] | ansible.builtin.default('') }}
    success_msg: >-
      doveadm confirms the LMTP-delivered message is in the INBOX of '{{ __testing_dovecot_imap_user }}'.


## Functional: end-to-end SMTP via the Postfix MTA
#
# The real production path: submit a message to Postfix over SMTP; Postfix routes
# the mail domain to Dovecot's postfix-private LMTP socket; Dovecot delivers it
# to the Maildir. This exercises the socket plumbing the role exposes for an MTA.

- name: "Molecule | Verify | Submit a message to the Postfix MTA over SMTP (127.0.0.1:25)"
  ansible.builtin.command:
    argv:
      - "/usr/bin/python3"
      - "-c"
      - |
        import smtplib, sys
        rcpt = sys.argv[1]
        msg = ("From: postfix-e2e@%s\r\n"
               "To: %s\r\n"
               "Subject: molecule-postfix-e2e\r\n\r\n"
               "Delivered end-to-end through Postfix.\r\n" % (rcpt.split("@")[1], rcpt))
        s = smtplib.SMTP("127.0.0.1", 25, timeout=15)
        s.sendmail("postfix-e2e@%s" % rcpt.split("@")[1], [rcpt], msg)
        s.quit()
        print("SMTP-SUBMITTED-OK")
      - "{{ __testing_dovecot_imap_user }}"
  changed_when: true
  register: __testing_smtp_submit_result


- name: "Molecule | Verify | Poll the mailbox until the Postfix-delivered message arrives"
  ansible.builtin.command:
    argv:
      - "{{ __run_dovecot_doveadm_exec_path }}"
      - "search"
      - "-u"
      - "{{ __testing_dovecot_imap_user }}"
      - "mailbox"
      - "INBOX"
      - "subject"
      - "molecule-postfix-e2e"
  changed_when: false
  failed_when: false
  register: __testing_smtp_search_result
  until:
    - (__testing_smtp_search_result['stdout'] | ansible.builtin.trim | ansible.builtin.length) > 0
  retries: 15
  delay: 1


- name: "Molecule | Verify | Assert the SMTP message was delivered end-to-end (Postfix -> Dovecot LMTP)"
  ansible.builtin.assert:
    that:
      - "'SMTP-SUBMITTED-OK' in __testing_smtp_submit_result['stdout']"
      - (__testing_smtp_search_result['stdout'] | ansible.builtin.trim | ansible.builtin.length) > 0
    fail_msg: >-
      The SMTP message submitted to Postfix did not arrive in
      '{{ __testing_dovecot_imap_user }}'s INBOX via LMTP.
      submit stdout: {{ __testing_smtp_submit_result['stdout'] | ansible.builtin.default('') }}
      submit stderr: {{ __testing_smtp_submit_result['stderr'] | ansible.builtin.default('') }}
      doveadm search stdout: {{ __testing_smtp_search_result['stdout'] | ansible.builtin.default('') }}
    success_msg: >-
      End-to-end SMTP works: Postfix routed the message to Dovecot's LMTP socket
      and it is in '{{ __testing_dovecot_imap_user }}'s INBOX.


## No plugin/module load failures
#
# doveconf -c accepts ANY name in mail_plugins without checking the .so exists,
# so a removed/typo'd plugin only fails at runtime. After exercising IMAP + LMTP
# (which load all the configured plugins), confirm Dovecot logged no module-load
# failure.

- name: "Molecule | Verify | Collect recent Dovecot error log"
  ansible.builtin.command:
    argv:
      - "{{ __run_dovecot_doveadm_exec_path }}"
      - "log"
      - "errors"
  changed_when: false
  failed_when: false
  register: __testing_doveadm_log_errors


- name: "Molecule | Verify | Assert no plugin/module failed to load at runtime"
  ansible.builtin.assert:
    that:
      - "'not found from directory' not in (__testing_doveadm_log_errors['stdout'] | ansible.builtin.default(''))"
      - "'dlopen' not in (__testing_doveadm_log_errors['stdout'] | ansible.builtin.default(''))"
    fail_msg: >-
      Dovecot logged a plugin/module load failure (a configured plugin's .so is
      missing or failed to load):
      {{ __testing_doveadm_log_errors['stdout'] | ansible.builtin.default('') }}
    success_msg: "No plugin/module load failures in the Dovecot error log (all configured plugins loaded)."


## Functional: LDAP-backed login
#
# Proves the second link of the auth chain: a user unknown to the passwd-file
# falls through to the ldap passdb/userdb (the localhost slapd from prepare) and
# can log in over TLS.

- name: "Molecule | Verify | Assert slapd (the test directory) is running"
  ansible.builtin.assert:
    that:
      - (ansible_facts['services']['slapd.service'] | ansible.builtin.default({}))['state'] | ansible.builtin.default('') == 'running'
    fail_msg: "The test LDAP server (slapd) is not running."
    success_msg: "The test LDAP server (slapd) is running."


- name: "Molecule | Verify | Confirm the LDAP demo user exists in the directory"
  ansible.builtin.command:
    argv:
      - "/usr/bin/ldapsearch"
      - "-x"
      - "-H"
      - "ldap://127.0.0.1"
      - "-b"
      - "dc=example,dc=test"
      - "-LLL"
      - "(uid={{ __testing_dovecot_ldap_user }})"
      - "dn"
  changed_when: false
  register: __testing_ldapsearch_result


- name: "Molecule | Verify | Assert the LDAP demo user is present"
  ansible.builtin.assert:
    that:
      - ('uid=' ~ __testing_dovecot_ldap_user) in __testing_ldapsearch_result['stdout']
    fail_msg: "The LDAP demo user '{{ __testing_dovecot_ldap_user }}' was not found in the directory."
    success_msg: "The LDAP demo user '{{ __testing_dovecot_ldap_user }}' is present in the directory."


- name: "Molecule | Verify | IMAP LOGIN (LDAP user) over implicit TLS (993)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:993"
      - "-quiet"
      - "-crlf"
    stdin: "a1 LOGIN {{ __testing_dovecot_ldap_user }} {{ __testing_dovecot_ldap_password }}\na2 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_ldap_login_result


- name: "Molecule | Verify | Assert the LDAP-backed IMAP LOGIN succeeded"
  ansible.builtin.assert:
    that:
      - "'a1 OK' in __testing_ldap_login_result['stdout']"
    fail_msg: >-
      LDAP-backed IMAP LOGIN as '{{ __testing_dovecot_ldap_user }}' over TLS (993)
      did not succeed (expected an 'a1 OK' tagged response).
      stdout: {{ __testing_ldap_login_result['stdout'] | ansible.builtin.default('') }}
      stderr: {{ __testing_ldap_login_result['stderr'] | ansible.builtin.default('') }}
    success_msg: "LDAP-backed IMAP LOGIN as '{{ __testing_dovecot_ldap_user }}' over TLS (993) succeeded."


# Master users: the converge wires a master passdb (run_dovecot_external_files.
# master_users -> user "admin", password "molecule-test-only") first in the chain
# and sets auth_master_user_separator = "*". An admin can therefore log in as any
# user via "<loginuser>*admin" + the MASTER password. We verify both that this
# works AND that the login user's own password is NOT accepted via the separator
# (otherwise the master passdb would be a no-op that merely lets everyone in).
- name: "Molecule | Verify | Master-user IMAP LOGIN over implicit TLS (993)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:993"
      - "-quiet"
      - "-crlf"
    # The username carries "*" (a LOGIN list-wildcard) so it must be a quoted
    # IMAP string, not an atom.
    stdin: "a1 LOGIN \"{{ __testing_dovecot_imap_user }}*admin\" \"molecule-test-only\"\na2 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_master_login_result


- name: "Molecule | Verify | Master-user IMAP LOGIN with the login user's own password (must fail)"
  ansible.builtin.command:
    argv:
      - "{{ __testing_openssl_executable }}"
      - "s_client"
      - "-connect"
      - "127.0.0.1:993"
      - "-quiet"
      - "-crlf"
    stdin: "a1 LOGIN \"{{ __testing_dovecot_imap_user }}*admin\" \"{{ __testing_dovecot_imap_password }}\"\na2 LOGOUT\n"
  changed_when: false
  failed_when: false
  register: __testing_master_login_negative_result


- name: "Molecule | Verify | Assert master-user login works and only with the master password"
  ansible.builtin.assert:
    that:
      - "'a1 OK' in __testing_master_login_result['stdout']"
      - "'a1 OK' not in __testing_master_login_negative_result['stdout']"
    fail_msg: >-
      Master-user IMAP LOGIN as '{{ __testing_dovecot_imap_user }}*admin' did not behave
      as expected: the master password must succeed and the login user's own password
      must be rejected via the master separator.
      master-pw stdout: {{ __testing_master_login_result['stdout'] | ansible.builtin.default('') }}
      own-pw stdout: {{ __testing_master_login_negative_result['stdout'] | ansible.builtin.default('') }}
    success_msg: >-
      Master-user IMAP LOGIN as '{{ __testing_dovecot_imap_user }}*admin' succeeded with the
      master password and was correctly rejected with the login user's own password.


# Upstream repository (repo.dovecot.org)
- name: "Molecule | Verify | Upstream repository (Debian only)"
  when:
    - ansible_facts['distribution'] == 'Debian' # Converge enablesrun_dovecot_repository_manage only on Debian
  block:

    - name: "Molecule | Verify | Read the deb822 apt source for repo.dovecot.org"
      ansible.builtin.slurp:
        src: "/etc/apt/sources.list.d/dovecot-ce.sources"
      register: __testing_repo_sources

    - name: "Molecule | Verify | Query the installed dovecot-core origin"
      ansible.builtin.command:
        argv:
          - "apt-cache"
          - "policy"
          - "dovecot-core"
      changed_when: false
      register: __testing_repo_policy

    - name: "Molecule | Verify | Assert Dovecot is installed from the repo.dovecot.org upstream repository"
      ansible.builtin.assert:
        that:
          - "'repo.dovecot.org' in (__testing_repo_sources['content'] | ansible.builtin.b64decode)"
          # The signing key is managed inline in the deb822 Signed-By field, so the
          # armored key block must be embedded in the .sources file itself.
          - "'Signed-By:' in (__testing_repo_sources['content'] | ansible.builtin.b64decode)"
          - "'Jyo4AQDr/VanhFwPxSlZ3MKY4PWyLw4Fm9mTT2ofcluFttRsDg==' in (__testing_repo_sources['content'] | ansible.builtin.b64decode)"
          - "'repo.dovecot.org' in __testing_repo_policy['stdout']"
          - "'Installed: 2:' in __testing_repo_policy['stdout']"
        fail_msg: >-
          Expected dovecot-core to be installed from repo.dovecot.org. Source file:
          {{ __testing_repo_sources['content'] | ansible.builtin.b64decode }}
          apt-cache policy: {{ __testing_repo_policy['stdout'] | ansible.builtin.default('') }}
        success_msg: >-
          dovecot-core is installed from the repo.dovecot.org upstream repository
          (deb822 source + signing key present, apt-cache policy reports an
          upstream epoch-2 version).
