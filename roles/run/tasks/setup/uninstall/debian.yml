# Uninstall: Tasks specific to: Debian (os_family or distribution)
#
# Only tasks specific to the platform and its functionality should be included
# here. Tasks in this file will be executed before those defined in
# uninstall/default.yml.

---

# Plain file removal instead of deb822_repository: the module needs the
# python3-debian library even for state "absent", which is only installed
# when the repository feature was actually used, so uninstall would fail on
# every other Debian-family host. The install side writes everything
# (including the embedded signing key) into this single file.
- name: "Setup | Uninstall | Debian | Remove the Dovecot CE upstream apt source"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/dovecot-ce.sources"
    state: "absent"
