# Internal role variables and values that must NOT be overridden by the user.
#
# Variables defined here usually override earlier definitions due to the high
# precedence of this file. Each variable should have a concise comment above
# it, describing its purpose and how it fits into the role's functionality.

---

# Facts used by the role (gathered on a best-effort basis if needed), as a
# mapping of "gather_subset" name to the ansible_facts keys it provides.
#
# To identify which subset a fact belongs to during development, you can use
# the following snippet:
#
# - ansible.builtin.setup:
#     gather_subset:
#       - '!min'
#       - '<subset_name, see parameter doc for details>'
__run_dovecot_used_facts:
  distribution:
    - "distribution"
    - "distribution_major_version"
    - "distribution_version"
    - "os_family"


# List of platforms this role supports and was designed for.
#
# Unlike our other Ansible roles, the role will fail if the list contains values
# and the role is executed on an unknown (not listed) platform. This is
# intentional because Dovecot has specific requirements and version constraints.
__run_dovecot_supported_platforms:
  - name: "Debian"
    versions:
      - "13" # nothing older than 13, Ubuntu 24.04 ships with Dovecot 2.3
  - name: "Fedora"
    versions:
      - "43"
      - "44"
  - name: "Ubuntu"
    versions:
      - "26.04" # nothing older than 26.04, Ubuntu 24.04 ships with Dovecot 2.3


# List of package names to be installed when run_dovecot_state is
# set to "present". Per-platform overrides usually replace this list.
__run_dovecot_packages_install:
  - "dovecot"


# Dictionary mapping Dovecot protocol names to additional package lists.
#
# Protocols listed in run_dovecot_settings['protocols'] (and per-protocol
# blocks named "protocol <name>":) are looked up here at task time to derive
# the set of distribution sub-packages to install. Per-platform overrides
# replace this dictionary with platform-specific values. Protocols not in the
# map cause a hard fail listing the known protocols.
#
# Keep in sync with __run_dovecot_packages_plugins_map for "sieve" — sieve
# appears both as a protocol-like entry (the ManageSieve service) and as a
# mail_plugin.
__run_dovecot_packages_protocols_map:
  imap: []
  lmtp: []
  pop3: []
  submission: []
  sieve: []


# Dictionary mapping Dovecot mail_plugin names to additional package lists.
#
# Plugins listed in run_dovecot_settings['mail_plugins'] (and inside
# "protocol <name>": blocks) are looked up here at task time to derive the
# set of distribution sub-packages to install. Per-platform overrides replace
# this dictionary with platform-specific values. This map doubles as the set of
# plugins the role knows about: a plugin token not present here causes a hard
# fail (assertion in tasks/setup/install/default.yml) listing the known plugins,
# catching typos early instead of letting Dovecot fail later with a less
# actionable error. Add new plugins here (value [] if they need no extra
# package) to support them.
__run_dovecot_packages_plugins_map:
  acl: []
  fts: []
  fts_flatcurve: []
  fts_solr: []
  fts_xapian: []
  imap_acl: []
  imap_filter_sieve: []
  imap_quota: []
  imap_sieve: []
  last_login: []
  listescape: []
  mail_compress: []
  mail_crypt: []
  mail_lua: []
  mailbox_alias: []
  notify: []
  push_notification: []
  push_notification_lua: []
  quota: []
  quota_clone: []
  sieve: []
  sieve_extprograms: []
  trash: []
  virtual: []
  welcome: []


# Dictionary mapping Dovecot passdb/userdb driver names to additional package
# lists (the authentication/user-database backends).
#
# The `driver` value of every entry in run_dovecot_passdbs and
# run_dovecot_userdbs is looked up here at task time to derive the set of
# distribution sub-packages to install. Per-platform overrides replace this
# dictionary with platform-specific values. Drivers not in the map are silently
# ignored on the package-install side (e.g. static/pam/passwd-file/shadow/passwd
# need no extra package, and on platforms that build a backend into the base
# package the value is simply an empty list). This is intentionally lenient
# (like the plugin map) rather than strict (like the protocol map): the set of
# auth drivers is open-ended.
#
# Empty by default; platforms that split backends into sub-packages (Debian)
# populate it in vars/<platform>.yml.
__run_dovecot_packages_authdb_map: {}


# List of package names to be uninstalled when run_dovecot_state is
# set to "absent". This variable is useful when __run_dovecot_packages_install
# contains packages that are required for the managed software to function but
# should not be removed during uninstallation, as doing so could break other
# software. This is usually the case if there are common dependencies like
# "curl" or "openssl" which typically should remain installed even after
# uninstalling the software managed by this role.
#
# By default this is the union of __run_dovecot_packages_install plus every
# package listed under __run_dovecot_packages_protocols_map and
# __run_dovecot_packages_plugins_map, so that a clean uninstall removes
# everything the role might have installed in any configuration permutation.
__run_dovecot_packages_uninstall: >-
  {{
    (__run_dovecot_packages_install
     + (__run_dovecot_packages_protocols_map.values()
        | ansible.builtin.flatten
        | ansible.builtin.list)
     + (__run_dovecot_packages_plugins_map.values()
        | ansible.builtin.flatten
        | ansible.builtin.list)
     + (__run_dovecot_packages_authdb_map.values()
        | ansible.builtin.flatten
        | ansible.builtin.list))
    | ansible.builtin.unique
    | ansible.builtin.list
  }}


# List of package names to be removed unconditionally before installation
# (e.g., to prevent conflicts or resolve incompatibilities).
__run_dovecot_packages_removal: []


# List of paths of files and directories to be removed unconditionally after
# installation. This is useful for removing default configuration resources
# that would otherwise create confusion or conflict with custom configurations
# managed by this role.
__run_dovecot_paths_removal: []


# Dictionary of files to be overwritten with a managed comment instead of being
# deleted. Keys are file paths; values are the single-line comment characters to
# use. This is needed on platforms where the package manager reinstalls deleted
# files on package update. Restored files would conflict with the managed
# configuration, while modified files are preserved. For example, RPM with
# %config(noreplace) restores missing files but preserves modified ones.
__run_dovecot_paths_neutralize: {}


# Main Dovecot configuration file (dovecot.conf). The role owns this file in
# full (no "!include conf.d/*.conf" is emitted) so any distribution-shipped
# conf.d/*.conf files are left dormant on disk; a tombstone marker is dropped
# alongside them to explain the situation to operators.
#
# Mode is 0600 root:root on purpose: in Dovecot 2.4 backend credentials (e.g.
# the LDAP/SQL bind password via ldap_auth_dn_password) live INLINE in
# dovecot.conf, so the file must not be world-readable. The Dovecot master
# process reads it as root before dropping privileges, so root-only is safe.
__run_dovecot_dovecotconf_file_path: "/etc/dovecot/dovecot.conf"
__run_dovecot_dovecotconf_file_owner: "root"
__run_dovecot_dovecotconf_file_group: "root"
__run_dovecot_dovecotconf_file_mode: "u=rw,g=,o=" # 0600

# Directory holding distribution-shipped configuration snippets that the role
# deliberately leaves dormant. A tombstone marker is placed there to explain
# the situation to operators stumbling onto the leftovers.
__run_dovecot_confd_dir_path: "/etc/dovecot/conf.d"
__run_dovecot_confd_tombstone_file_path: "/etc/dovecot/conf.d/00-TOMBSTONE-ALL-FILES-HERE-IGNORED.README"


# Daemon service name and paths of executables for management and validation.
__run_dovecot_service_name: "dovecot.service"
__run_dovecot_dovecot_exec_path: "/usr/sbin/dovecot"
__run_dovecot_doveconf_exec_path: "/usr/bin/doveconf"
__run_dovecot_doveadm_exec_path: "/usr/bin/doveadm"

# Path to "dovecot-lda" (the local delivery agent). Used by the rendered
# quota-warning script to inject the warning mail back into the user's
# mailbox.
__run_dovecot_dovecot_lda_exec_path: "/usr/libexec/dovecot/dovecot-lda"


# System group of the Dovecot authentication process (Dovecot's
# default_internal_group, "dovecot" on all supported platforms). External files
# that an auth backend reads by path (e.g. the master-users passwd-file) must
# be readable by this group: the auth process runs as the unprivileged dovecot
# user, NOT as root and NOT as the mail-storage (vmail) group, so it cannot read
# a file owned only by root or by the mail group. (dovecot.conf itself does not
# need this: the master process reads it as root and distributes settings via
# the config socket.)
__run_dovecot_auth_group: "dovecot"


# Default values for the optional external files (run_dovecot_external_files.*).
# These are the fallbacks applied when a key is omitted from an entry. They live
# here, not inline in tasks/config/default.yml, so every role default has a
# single home; the tasks only contain the "user value or this default" glue.

# Master-users passwd-file (the passdb with master = yes reads it).
__run_dovecot_external_files_master_users_path_default: "/etc/dovecot/passwd.masterusers"

# Quota-warning script (rendered, then wired to a "service quota-warning").
__run_dovecot_external_files_quota_warning_path_default: "/usr/local/bin/dovecot-quota-warning.sh"
__run_dovecot_external_files_quota_warning_from_default: "postmaster"
__run_dovecot_external_files_quota_warning_subject_default: "Quota warning (${PERCENT}% full)"
__run_dovecot_external_files_quota_warning_body_default: |
  EN: Your mailbox is now ${PERCENT}% full.
  DE: Ihr Postfach ist zu ${PERCENT}% belegt.
  FR: Votre boîte est pleine à ${PERCENT}%


### Upstream package repository (repo.dovecot.org), opt-in via run_dovecot_repository_manage.

# Whether the official Dovecot CE 2.4 repository (repo.dovecot.org) provides
# packages for this platform. Default false (no coverage). The platform vars file
# of every covered platform overrides this to true and supplies the connection
# details if there is support.
__run_dovecot_repository_supported: false


