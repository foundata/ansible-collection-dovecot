# Install: Tasks specific to: Debian (os_family or distribution)
#
# Only tasks specific to the platform and its functionality should be included
# here. Tasks in this file will be executed before those defined in
# install/default.yml.
#
# SPDX-FileCopyrightText: foundata GmbH <https://foundata.com>
# SPDX-License-Identifier: GPL-3.0-or-later

---

- name: "Setup | Install | Debian | Configure the official Dovecot CE upstream apt repository"
  when:
    - run_dovecot_repository_manage | ansible.builtin.bool
    - __run_dovecot_repository_supported | ansible.builtin.bool
  block:

    # Replaces deb822_repository's install_python_debian (ansible-core 2.20+)
    # to stay compatible with ansible-core 2.19.
    - name: "Setup | Install | Debian | Install python3-debian (required by deb822_repository)"
      ansible.builtin.apt:
        name: "python3-debian"
        state: "present"


    - name: "Setup | Install | Debian | Configure the deb822 apt source"
      ansible.builtin.deb822_repository:
        name: "dovecot-ce" # -> /etc/apt/sources.list.d/dovecot-ce.sources
        state: "present"
        enabled: true
        types:
          - "deb"
        uris: "{{ __run_dovecot_repository_apt_uris }}"
        suites: "{{ __run_dovecot_repository_apt_suites }}"
        components: "{{ __run_dovecot_repository_apt_components }}"
        signed_by: "{{ __run_dovecot_repository_gpgpubkey }}"
      register: __run_dovecot_repository_source_result


    # noqa no-handler: this must refresh the cache BEFORE the package install in
    # setup/install/default.yml (same role run); a handler would only fire at the
    # end of the play, too late, so the change-gated inline task is intentional.
    - name: "Setup | Install | Debian | Refresh apt cache after a repository change" # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
      when:
        - __run_dovecot_repository_source_result is ansible.builtin.changed
