---

security_fixes:
  - >
    ``run`` role - Rendered configuration content can no longer leak secrets
    into task output. In diff mode, the main ``dovecot.conf`` template (which
    can contain credentials such as an LDAP bind password from
    ``run_dovecot_passdbs``) printed its full content diff; it now sets
    ``diff: false`` while keeping ``doveconf`` validation errors visible. The
    master-users passwd-file task (password hashes) now runs with
    ``no_log: true``.
