# Configuration: Manage settings, like adapting or creating config files.

---

- name: "Config | Default | Render main configuration file ({{ __run_dovecot_dovecotconf_file_path }})"
  ansible.builtin.template:
    src: "dovecot.conf.j2"
    dest: "{{ __run_dovecot_dovecotconf_file_path }}"
    owner: "{{ __run_dovecot_dovecotconf_file_owner }}"
    group: "{{ __run_dovecot_dovecotconf_file_group }}"
    mode: "{{ __run_dovecot_dovecotconf_file_mode }}"
    validate: "{{ __run_dovecot_doveconf_exec_path }} -c %s"
  # The rendered file can contain credentials (e.g. an LDAP bind password from
  # run_dovecot_passdbs), which must not be leaked into diff output. diff
  # instead of no_log on purpose: doveconf validation errors must stay visible.
  diff: false
  notify:
    - "run_dovecot: reload dovecot.service"


### External files: ownership manifest of previously created files

# The external file paths are freely configurable, so a renamed path cannot
# be derived from the current variables. The manifest records the paths this
# role created: files recorded there but no longer configured (renamed,
# de-listed or disabled entries) get removed again below, and uninstall uses
# the same record for complete cleanup.
- name: "Config | Default | External files | Read the manifest of previously created files"
  ansible.builtin.slurp:
    src: "{{ __run_dovecot_external_files_manifest_path }}"
  register: __run_dovecot_external_manifest_slurp
  failed_when:
    # tolerate a missing manifest (first run; treated as empty below)
    - __run_dovecot_external_manifest_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__run_dovecot_external_manifest_slurp['msg'] | ansible.builtin.lower)"


- name: "Config | Default | External files | Determine the previously created files"
  ansible.builtin.set_fact:
    __run_dovecot_external_manifest_old: >-
      {{
        (((__run_dovecot_external_manifest_slurp['content'] | ansible.builtin.default('')
           | ansible.builtin.b64decode | ansible.builtin.from_yaml)
          | ansible.builtin.default({}, true))['files'] | ansible.builtin.default([]))
      }}


### External files: Master users passwd-file

- name: "Config | Default | External files | Master users"
  when:
    - run_dovecot_external_files['master_users'] is ansible.builtin.defined
  vars:
    __run_dovecot_external_files_master_users_path: >-
      {{ run_dovecot_external_files['master_users']['path']
         | ansible.builtin.default(__run_dovecot_external_files_master_users_path_default, true) }}
    __run_dovecot_external_files_master_users_entries: >-
      {{ run_dovecot_external_files['master_users']['entries'] | ansible.builtin.default([]) }}
    __run_dovecot_external_files_master_users_enabled: >-
      {{ run_dovecot_external_files['master_users']['enabled'] | ansible.builtin.default(true) }}
  block:

    - name: "Config | Default | External files | Master users: Render passwd-file"
      ansible.builtin.template:
        src: "master-users.j2"
        dest: "{{ __run_dovecot_external_files_master_users_path }}"
        owner: "root"
        # The Dovecot auth process (runs as the dovecot user) reads this file, so
        # it must be readable by the dovecot auth group, not the mail group.
        group: "{{ __run_dovecot_auth_group }}"
        mode: "u=rw,g=r,o=" # 0640, contains password hashes
      no_log: true # the rendered file contains password hashes, keep them out of logs and diffs
      when:
        - __run_dovecot_external_files_master_users_enabled | ansible.builtin.bool
      notify:
        - "run_dovecot: reload dovecot.service"

    - name: "Config | Default | External files | Master users: Remove passwd-file (disabled)"
      ansible.builtin.file:
        path: "{{ __run_dovecot_external_files_master_users_path }}"
        state: "absent"
      when:
        - not (__run_dovecot_external_files_master_users_enabled | ansible.builtin.bool)
      notify:
        - "run_dovecot: reload dovecot.service"


### External files: Quota-warning script

- name: "Config | Default | External files | Quota-warning script"
  when:
    - run_dovecot_external_files['quota_warning_script'] is ansible.builtin.defined
  vars:
    __run_dovecot_external_files_quota_warning_path: >-
      {{ run_dovecot_external_files['quota_warning_script']['path']
         | ansible.builtin.default(__run_dovecot_external_files_quota_warning_path_default, true) }}
    __run_dovecot_external_files_quota_warning_from: >-
      {{ run_dovecot_external_files['quota_warning_script']['from']
         | ansible.builtin.default(__run_dovecot_external_files_quota_warning_from_default) }}
    __run_dovecot_external_files_quota_warning_subject: >-
      {{ run_dovecot_external_files['quota_warning_script']['subject']
         | ansible.builtin.default(__run_dovecot_external_files_quota_warning_subject_default) }}
    __run_dovecot_external_files_quota_warning_body: >-
      {{ run_dovecot_external_files['quota_warning_script']['body']
         | ansible.builtin.default(__run_dovecot_external_files_quota_warning_body_default, true) }}
    __run_dovecot_external_files_quota_warning_enabled: >-
      {{ run_dovecot_external_files['quota_warning_script']['enabled'] | ansible.builtin.default(true) }}
  block:

    - name: "Config | Default | External files | Quota-warning script: Render script"
      ansible.builtin.template:
        src: "dovecot-quota-warning.sh.j2"
        dest: "{{ __run_dovecot_external_files_quota_warning_path }}"
        owner: "root"
        group: "root"
        mode: "u=rwx,g=rx,o=rx" # 0755
      when:
        - __run_dovecot_external_files_quota_warning_enabled | ansible.builtin.bool

    - name: "Config | Default | External files | Quota-warning script: Remove script (disabled)"
      ansible.builtin.file:
        path: "{{ __run_dovecot_external_files_quota_warning_path }}"
        state: "absent"
      when:
        - not (__run_dovecot_external_files_quota_warning_enabled | ansible.builtin.bool)


### External files: reconcile the manifest

- name: "Config | Default | External files | Remove files at paths no longer configured"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  loop: >-
    {{
      __run_dovecot_external_manifest_old
      | ansible.builtin.reject('ansible.builtin.in', __run_dovecot_external_files_owned)
      | ansible.builtin.list
    }}
  notify:
    - "run_dovecot: reload dovecot.service"


- name: "Config | Default | External files | Record the created files in the manifest"
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (foundata.dovecot.run); do not edit.
      # Paths of the external files created by this role; used to clean up
      # the previous file after a path change and on uninstall.
      {{ {'files': (__run_dovecot_external_files_owned | ansible.builtin.sort)} | ansible.builtin.to_nice_yaml(indent=2) }}
    dest: "{{ __run_dovecot_external_files_manifest_path }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644, contains only paths
  when:
    - (__run_dovecot_external_files_owned | ansible.builtin.length) > 0


- name: "Config | Default | External files | Remove the manifest (no external files configured)"
  ansible.builtin.file:
    path: "{{ __run_dovecot_external_files_manifest_path }}"
    state: "absent"
  when:
    - (__run_dovecot_external_files_owned | ansible.builtin.length) == 0


- name: "Config | Default | Ensure handler runs (e.g. config validation/reload) before (re)starting Dovecot after packages were installed"
  ansible.builtin.meta: "flush_handlers"
  when:
    - run_dovecot_service_state in ['enabled', 'running']
    - (__run_dovecot_package_install_result is ansible.builtin.defined and
       __run_dovecot_package_install_result is ansible.builtin.changed) or
      (__run_dovecot_package_install_extras_result is ansible.builtin.defined and
       __run_dovecot_package_install_extras_result is ansible.builtin.changed)
