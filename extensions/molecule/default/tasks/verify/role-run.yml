## External files: master users

- name: "Molecule | Verify | Stat the master-users passwd-file"
  ansible.builtin.stat:
    path: "/etc/dovecot/passwd.masterusers"
  register: __testing_masterusers_stat


- name: "Molecule | Verify | Assert the master-users passwd-file exists and is readable by the auth group"
  ansible.builtin.assert:
    that:
      - __testing_masterusers_stat['stat']['exists']
      - __testing_masterusers_stat['stat']['mode'] == '0640'
      # Must be group-readable by the Dovecot auth group (the auth process runs
      # as the dovecot user, not root/vmail), otherwise master-user login breaks.
      - __testing_masterusers_stat['stat']['gr_name'] == __run_dovecot_auth_group
    fail_msg: >-
      The master-users passwd-file is missing or has unexpected mode/group
      (expected group '{{ __run_dovecot_auth_group }}'):
      {{ __testing_masterusers_stat['stat'] | ansible.builtin.default({}) }}
    success_msg: >-
      The master-users passwd-file at '/etc/dovecot/passwd.masterusers' exists with mode 0640
      and group '{{ __run_dovecot_auth_group }}'.


- name: "Molecule | Verify | Read master-users passwd-file content"
  ansible.builtin.slurp:
    src: "/etc/dovecot/passwd.masterusers"
  register: __testing_masterusers_content


- name: "Molecule | Verify | Assert master-users passwd-file contains the expected entry"
  ansible.builtin.assert:
