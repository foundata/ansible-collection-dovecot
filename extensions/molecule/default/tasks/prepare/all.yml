# Tasks for the Molecule prepare stage: Add resources needed for later steps
# (e.g. converge, verify) on all driver-created instances.
#
# The role itself does NOT manage TLS certificate material (cert/key files are
# expected to already exist, e.g. provisioned by a CA, certbot or another role).
# To still be able to test Dovecot's TLS surface (implicit IMAPS and STARTTLS)
# we generate a throwaway, self-signed dummy certificate here so the converge
# stage can point Dovecot's ssl_server_cert_file / ssl_server_key_file at it.


- name: "Molecule | Prepare | Install needed packages"
  ansible.builtin.package:
    name:
      - "ca-certificates" # Certificate management tools (update-ca-certificates / update-ca-trust)
      - "openssl" # Create the dummy certificate and run the TLS client checks (s_client)
    state: "present"


# ansible.builtin.package_facts (used in the verify stage) needs the platform's
# package-manager Python bindings, which the base images do not always ship.
# Pre-seed them per OS family so the verify-stage assertions can enumerate
# installed packages.
- name: "Molecule | Prepare | Install dependencies needed for package_facts (Red Hat)"
  ansible.builtin.package:
    name:
      - "python3-rpm"
      - "python3-libdnf5"
    state: "present"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat'


- name: "Molecule | Prepare | Install dependencies needed for package_facts (Debian)"
  ansible.builtin.package:
    name:
      - "python3-apt"
    state: "present"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'


# Helpful overview regarding certificate paths and tools on different OS:
# https://github.com/millermatt/osca

- name: "Molecule | Prepare | Certificates: Set paths (Debian)"
  ansible.builtin.set_fact:
    __testing_certs_cert_dir: "/etc/ssl/certs"
    __testing_certs_key_dir: "/etc/ssl/private"
    __testing_certs_trustanchors_dir: "/usr/local/share/ca-certificates"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'


- name: "Molecule | Prepare | Certificates: Set paths (Red Hat)"
  ansible.builtin.set_fact:
    __testing_certs_cert_dir: "/etc/pki/tls/certs"
    __testing_certs_key_dir: "/etc/pki/tls/private"
    __testing_certs_trustanchors_dir: "/etc/pki/ca-trust/source/anchors"
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat'


- name: "Molecule | Prepare | Certificates: Set dummy cert/key file paths"
  ansible.builtin.set_fact:
    # The cert can be world-readable (mode 0644), the key must stay root-only
    # (mode 0600). Dovecot's master process runs as root and reads both.
    __testing_certs_dummycert_pem: "{{ __testing_certs_cert_dir }}/dovecot-dummy-cert.pem"
    __testing_certs_dummykey_pem: "{{ __testing_certs_key_dir }}/dovecot-dummy-key.pem"


- name: "Molecule | Prepare | Certificates: Ensure the private key directory exists"
  ansible.builtin.file:
    path: "{{ __testing_certs_key_dir }}"
    state: "directory"
    owner: "root"
    group: "root"
    mode: "u=rwx,g=rx,o=" # 0750


- name: "Molecule | Prepare | Certificates: Get info about dummy cert file"
  ansible.builtin.stat:
    path: "{{ __testing_certs_dummycert_pem }}"
    get_checksum: false
  register: __testing_dummycert_stat_result


- name: "Molecule | Prepare | Certificates: Create dummy cert and key"
  ansible.builtin.command:
    argv:
      - "/usr/bin/openssl"
      - "req"
      - "-newkey"
      - "rsa:2048" # 2048 is plenty for a throwaway test cert and much faster than 4096
      - "-keyout"
      - "{{ __testing_certs_dummykey_pem }}"
      - "-nodes" # do not encrypt the key, Dovecot would not be able to read it unattended
      - "-x509"
      - "-days"
      - "3650"
      - "-out"
      - "{{ __testing_certs_dummycert_pem }}"
      - "-subj"
      - >-
        /C=XX/ST=SomeState/L=SomeCity/O=SomeOrganization/OU=SomeOrganizationalUnit/CN={{
        ansible_facts['fqdn'] | ansible.builtin.default('dovecot.example.com', true) }}
  register: __testing_dummycert_create_result
  changed_when:
    - __testing_dummycert_create_result['rc'] == 0
  when:
    - __testing_dummycert_stat_result is ansible.builtin.defined
    - not __testing_dummycert_stat_result['stat']['exists']


- name: "Molecule | Prepare | Certificates: Set file permissions for dummy cert (world-readable)"
  ansible.builtin.file:
    path: "{{ __testing_certs_dummycert_pem }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


- name: "Molecule | Prepare | Certificates: Set file permissions for dummy key (root-only)"
  ansible.builtin.file:
    path: "{{ __testing_certs_dummykey_pem }}"
    owner: "root"
    group: "root"
    mode: "u=rw,g=,o=" # 0600


- name: "Molecule | Prepare | Certificates: Copy dummy cert into trust anchor store"
  ansible.builtin.copy:
    src: "{{ __testing_certs_dummycert_pem }}"
    dest: "{{ __testing_certs_trustanchors_dir }}/{{ __testing_certs_dummycert_pem | ansible.builtin.basename }}"
    remote_src: true
    owner: "root"
    group: "root"
    mode: "u=rw,g=r,o=r" # 0644


- name: "Molecule | Prepare | Certificates: Update OS certificate store (Debian)"
  ansible.builtin.command:
    argv:
      - "/usr/sbin/update-ca-certificates"
  changed_when: false
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'debian'


- name: "Molecule | Prepare | Certificates: Update OS certificate store (Red Hat)"
  ansible.builtin.command:
    argv:
      - "/usr/bin/update-ca-trust"
  changed_when: false
  when:
    - (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat'
