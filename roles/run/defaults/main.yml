# Default variables and values for this role.
#
# These variables are designed to be easily overridden (as they have a low
# precedence) and typically allow users to customize the role's behavior.
# Each variable should have a clear comment above it, describing its purpose
# and how it fits into the role's functionality.

---

# Determines whether the managed resources should be `present` or `absent`.
#
# `present` ensures that required components, such as software packages, are
# installed and configured.
#
# `absent` reverts changes as much as possible, such as removing packages,
# deleting created users, stopping services, restoring modified settings, …
#
# - Type: str
# - Required: No
# - Default: present
# - Choices: present, absent
run_dovecot_state: "present"


# If set to `true`, all managed packages will be upgraded during each Ansible
# run (e.g., when the package provider detects a newer version than the
# currently installed one).
#
# - Type: bool
# - Required: No
# - Default: false
run_dovecot_autoupgrade: false


# Defines the status of the service(s).
#
# `enabled`: Service is running and will start automatically at boot.
#
# `disabled`: Service is stopped and will not start automatically at boot.
#
# `running`: Service is running but will not start automatically at boot. This
# can be used to start a service on the first Ansible run without enabling it
# for boot.
#
# `unmanaged`: Service will not start at boot, and Ansible will not manage its
# running state. This is primarily useful when services are monitored and
# managed by systems other than Ansible.
#
# The singular form (`service`) is used for simplicity. However, the defined
# status applies to all services if multiple are being managed by this role.
#
# - Type: str
# - Required: No
# - Default: enabled
# - Choices: enabled, disabled, running, unmanaged
run_dovecot_service_state: "enabled"

# Controls whether the role manages the system user and group that own the mail
# storage tree (Dovecot's conventional "vmail" identity).
#
# When set to `true`, the role creates the group defined by
# `run_dovecot_mail_group_name` / `run_dovecot_mail_group_gid` and the user
# defined by `run_dovecot_mail_user_name` / `run_dovecot_mail_user_uid` (no
# login shell, no password), and ensures the directory at
# `run_dovecot_mail_storage_path` exists with that ownership.
#
# When set to `false`, the role assumes the user, group and storage directory
# already exist (e.g. provisioned by another role, by your image, or by a
# directory service such as LDAP/AD) and leaves them untouched. You are then
# responsible for matching the UID/GID Dovecot expects.
#
# - Type: bool
# - Required: No
# - Default: true
run_dovecot_mail_user_manage: true

# Name of the POSIX user that owns Dovecot's mail storage tree.
#
# Used both for `chown` on `run_dovecot_mail_storage_path` (when
# `run_dovecot_mail_user_manage` is `true`) and as the canonical user name you
# typically reference from `run_dovecot_settings` (e.g. as `mail_uid`,
# `mail_gid`, in `service` blocks, in `unix_listener` owners).
#
# The role does NOT inject this name into `run_dovecot_settings` for you,
# keeping the mapping explicit avoids surprises.
#
# - Type: str
# - Required: No
# - Default: vmail
run_dovecot_mail_user_name: "vmail"

# Numeric UID for the user defined by `run_dovecot_mail_user_name`.
#
# A fixed UID makes mail storage portable between hosts (rsync, restore from
# backup, container migrations) without ownership rewrites. Pick a value that is
# free across all hosts that may ever access the same mail spool.
#
# Only takes effect when `run_dovecot_mail_user_manage` is `true`.
#
# - Type: int
# - Required: No
# - Default: 1000
run_dovecot_mail_user_uid: 1000

# Name of the POSIX group that owns Dovecot's mail storage tree.
#
# See `run_dovecot_mail_user_name` for usage notes as the same applies here for
# group ownership.
#
# - Type: str
# - Required: No
# - Default: vmail
run_dovecot_mail_group_name: "vmail"

# Numeric GID for the group defined by `run_dovecot_mail_group_name`.
#
# See `run_dovecot_mail_user_uid` for the rationale on fixed numeric IDs.
#
# Only takes effect when `run_dovecot_mail_user_manage` is `true`.
#
# - Type: int
# - Required: No
# - Default: 1000
run_dovecot_mail_group_gid: 1000

# Absolute path to the root directory holding Dovecot's mail storage tree.
#
# The role ensures the directory exists with ownership
# `run_dovecot_mail_user_name`: `run_dovecot_mail_group_name` and mode `0770`.
# Filesystem provisioning (partitioning, `mkfs`, mounts, `/etc/fstab`) is
# explicitly out of scope for this role — mount whatever backing storage you
# want at this path before running the role, or accept that it lives on the root
# filesystem.
#
# This path is not pushed into `run_dovecot_settings` automatically. Where
# Dovecot needs to know it (e.g. `mail_path`, `mail_home`, namespace
# `mail_path`, `auth_socket_path`, …), reference it explicitly in
# `run_dovecot_settings`.
#
# - Type: path
# - Required: No
# - Default: /srv/vmail
run_dovecot_mail_storage_path: "/srv/vmail"

# Complete Dovecot configuration as a nested YAML dictionary that mirrors
# Dovecot 2.4 grammar 1:1. The role renders it into a single
# `/etc/dovecot/dovecot.conf` (so there are no `conf.d` includes).
#
# Rules:
#
# - Scalar value → `key = value`. For settings that take a list (e.g.
#   `protocols`, `mail_plugins`, `auth_mechanisms`) you can pass either
#   Dovecot's native space-separated string OR a YAML list — the renderer joins
#   YAML lists with a single space, so `protocols: ["imap", "lmtp", "sieve"]`
#   and `protocols: "imap lmtp sieve"` render identically.
# - Dict value → `key { ... }` (recursive).
# - Block name encoded inline in the YAML key, split on first whitespace:
#   `"service imap-login"`, `"namespace inbox"`,
#   `'unix_listener "/var/spool/postfix/private/auth"'`, `plugin:` (anonymous).
#
# The `dovecot_config_version` key (which Dovecot 2.4 REQUIRES) is always
# emitted as the first non-comment line in `dovecot.conf`, regardless of where
# it appears in your YAML. Set it (and `dovecot_storage_version`, if you want to
# pin the on-disk storage format too) here like any other setting.
#
# Default is `{}` (empty) on purpose: the role ships zero opinionated Dovecot
# defaults. Dovecot's compiled-in defaults supply everything you do not set
# explicitly.
#
# The `mail_plugins` setting (top-level and per `"protocol <name>":` block) is
# parsed at task time to derive the set of distribution sub-packages to install.
# Plugin names unknown to the role's internal plugin map cause a hard fail with
# the list of known names.
#
# Example (illustrative excerpt, NOT a default the role applies):
#
# ```yaml
# run_dovecot_settings:
#   dovecot_config_version: "2.4.3"
#   dovecot_storage_version: "2.4.3"
#
#   protocols: "imap lmtp sieve"
#   mail_plugins: "acl quota sieve"
#   auth_allow_cleartext: false
#   auth_mechanisms: "plain login"
#
#   "namespace inbox":
#     type: "private"
#     separator: "/"
#     prefix: ""
#     inbox: true
#     mail_driver: "maildir"
#     mail_path: "~/mail/data"
#     "mailbox Drafts":
#       auto: "subscribe"
#       special_use: '\Drafts'
#
#   "service imap-login":
#     "inet_listener imap":
#       port: 143
#     "inet_listener imaps":
#       port: 993
#       ssl: true
#
#   "service auth":
#     'unix_listener "/var/spool/postfix/private/auth"':
#       mode: "0660"
#       user: "postfix"
#       group: "postfix"
#
#   "protocol imap":
#     mail_plugins: "$mail_plugins imap_acl imap_quota"
#
#   plugin:
#     sieve: "file:~/sieve;active=~/sieve.active"
#     quota: "dict:User quota::file:%h/dovecot-quota"
# ```
#
# Reference for all Dovecot 2.4 settings and block types:
# https://doc.dovecot.org/main/core/summaries/settings.html
#
# - Type: dict
# - Required: No
# - Default: {}
run_dovecot_settings: {}

# Raw verbatim Dovecot configuration appended at the end of
# `/etc/dovecot/dovecot.conf` (before the trailing `!include_try local.conf`).
#
# This is an escape hatch of last resort for the rare case where the
# `run_dovecot_settings` dictionary cannot express what you need (e.g. exotic
# block forms that bypass the YAML-key encoding, or a conditional include which
# was not known when the role was designed or simply a yet missing feature role
# feature you can open an issue for but need a solution *now*).
#
# Prefer `run_dovecot_settings` whenever possible.
#
# Default is `""` (empty string).
#
# - Type: str
# - Required: No
# - Default: ""
run_dovecot_settings_extra_content: ""

# Ordered list of Dovecot `passdb { ... }` blocks (the password database lookup
# chain). One block is rendered per list entry, in declaration order — this is
# the authentication fallback chain Dovecot evaluates top-to-bottom.
#
# A dedicated list is required (instead of folding into `run_dovecot_settings`)
# because the order of the lookup chain matters and YAML dictionaries neither
# preserve order nor allow the duplicate keys that repeated blocks would need.
#
# Each entry is a dictionary that is rendered into one `passdb <name> { ... }`
# block. The schema is intentionally loose: every key/value pair becomes an
# inline setting (`key = value`; nested dicts render as nested `key { ... }`
# blocks, YAML lists are space-joined), with two reserved keys:
#
# - `name`: the block's unique filter name (Dovecot 2.4 REQUIRES every
#   passdb/userdb block to be named). It is used only as the block label and is
#   NOT rendered as a setting. When omitted, the `driver` value is used as the
#   name.
# - `driver`: backend type (`static`, `passwd-file`, `pam`, `ldap`, `sql`, …).
#   When omitted, Dovecot uses the block `name` as the driver.
#
# Dovecot 2.4 removed the old `args` setting: driver-specific options are now
# given as individual inline settings instead (e.g. `password` for `static`,
# `passwd_file_path` for `passwd-file`, the LDAP connection settings for `ldap`,
# …). Refer to https://doc.dovecot.org/main/core/config/auth/passdb.html for the
# full list of per-driver settings and their semantics.
#
# IMPORTANT: some settings are *driver-scoped* and Dovecot only accepts them by
# their short name when the block name equals the driver (e.g. `static` 's
# `password`). For those drivers, leave `name` unset so it defaults to the
# driver. Settings that are not driver-scoped (e.g. `passwd-file` 's
# `passwd_file_path`) work under any custom `name`, which you need when
# declaring several blocks of the same driver.
#
# Example:
#
# ```yaml
# run_dovecot_passdbs:
#   # "name" omitted -> defaults to the driver ("passdb static { ... }"),
#   # required so the driver-scoped "password" resolves by its short name.
#   - driver: "static"
#     password: "{PLAIN}changeme"
#   # A custom "name" allows several blocks of the same driver; only use
#   # settings that are not driver-scoped (passwd_file_path qualifies).
#   - name: "master"
#     driver: "passwd-file"
#     passwd_file_path: "/etc/dovecot/passwd.masterusers"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
run_dovecot_passdbs: []

# Ordered list of Dovecot `userdb <name> { ... }` blocks (the user database
# lookup chain). One block is rendered per list entry, in declaration order.
#
# Same rationale, structure and rendering as `run_dovecot_passdbs` (named blocks
# via the reserved `name` key, `driver` selecting the backend, all other keys
# rendered as inline settings, no `args`), see there for details. For the
# `static` driver the synthetic user identity is given as a nested
# `fields { ... }` block (`uid`, `gid`, `home`, …).
#
# Refer to https://doc.dovecot.org/main/core/config/auth/userdb.html for the
# full list of per-driver settings and their semantics.
#
# Example:
#
# ```yaml
# run_dovecot_userdbs:
#   # "name" omitted -> defaults to the driver ("userdb static { ... }").
#   - driver: "static"
#     fields:
#       uid: "vmail"
#       gid: "vmail"
#       home: "/srv/vmail/%{user}"
# ```
#
# - Type: list
# - Required: No
# - Default: []
# - List elements: dict
run_dovecot_userdbs: []

# Container for file artifacts Dovecot reads or runs that are NOT `dovecot.conf`
# itself. They have their own parsers or semantics (passwd-file format,
# executable scripts, ...). You could create these files with your own
# additional tasks (e.g. upfront, before calling the role), but this variable
# exposes some handy helpers for commonly needed use cases.
#
# Note: LDAP is configured entirely inline in `run_dovecot_passdbs` /
# `run_dovecot_userdbs` (`driver: ldap` plus `uris`, `dn`, `dnpass`, `base`,
# `user_filter`, `pass_filter`, `user_attrs`, ...). Dovecot 2.4 no longer uses a
# separate `dovecot-ldap.conf.ext` file, so there is no LDAP helper here.
#
# Top-level keys are constrained to the closed set declared as suboptions below
# — unknown keys are rejected by Ansible's argument-spec validation at role
# start. For each known key, an `enabled` boolean controls the role's behaviour:
#
# - omitting the key entirely → the role ignores that artifact (the file is
#   neither created nor removed);
# - declaring the key with `enabled: true` (the default when the key is present)
#   → the role renders/manages the file;
# - declaring the key with `enabled: false` → the role removes the file if it
#   exists (handy for clean uninstall / staged migrations without having to
#   delete YAML around it).
#
# Example:
#
# ```yaml
# run_dovecot_external_files:
#   master_users:
#     enabled: true
#     path: "/etc/dovecot/passwd.masterusers"      # role-default; can be omitted
#     entries:
#       - username: "admin"
#         password_hash: "{BLF-CRYPT}$2y$05$..."
#   quota_warning_script:
#     enabled: true
#     path: "/usr/local/bin/dovecot-quota-warning.sh"
#     from: "postmaster@example.com"
#     subject: "Quota warning (${PERCENT}% full)"
#     body: |
#       EN: Your mailbox is now ${PERCENT}% full.
#       DE: Ihr Postfach ist zu ${PERCENT}% belegt.
# ```
#
# - Type: dict
# - Required: No
# - Default: {}
run_dovecot_external_files: {}
