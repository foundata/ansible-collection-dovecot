---

security_fixes:
  - >
    ``run`` role - ``run_dovecot_passdbs`` (entries commonly carry inline
    credentials such as ``static``'s ``password`` or LDAP bind passwords) and
    ``run_dovecot_external_files.master_users.entries[].password_hash`` are
    now marked ``no_log`` in the argument specification. Rendering was already
    protected (``diff: false``), but a failing argument validation and verbose
    task output could still expose the values.
