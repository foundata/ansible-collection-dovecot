# Uninstall: Manage basic resource removal, such as packages or service users.

---

- name: "Setup | Uninstall | Default | Stop and disable service: {{ __run_dovecot_service_name }}"
  ansible.builtin.service:
    name: "{{ __run_dovecot_service_name }}"
    state: "stopped"
    enabled: false
  failed_when: false # service may not exist anymore on partial uninstalls


- name: "Setup | Uninstall | Default | Remove packages"
  ansible.builtin.package:
    name: "{{ __run_dovecot_packages_uninstall }}"
    state: "absent"
  when:
    - __run_dovecot_packages_uninstall is ansible.builtin.defined
    - (__run_dovecot_packages_uninstall | ansible.builtin.length) > 0


# External files are removed at the union of the manifest-recorded paths (the
# files this role actually created, covering paths that were renamed since),
# the currently configured paths and the default paths (covering callers that
# already dropped the variable or removed the manifest by hand).
- name: "Setup | Uninstall | Default | Read the manifest of previously created external files"
  ansible.builtin.slurp:
    src: "{{ __run_dovecot_external_files_manifest_path }}"
  register: __run_dovecot_external_manifest_slurp
  failed_when:
    - __run_dovecot_external_manifest_slurp['msg'] is ansible.builtin.defined
    - "'file not found' not in (__run_dovecot_external_manifest_slurp['msg'] | ansible.builtin.lower)"


- name: "Setup | Uninstall | Default | Remove role-managed configuration and external files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: "absent"
  vars:
    __run_dovecot_uninstall_manifest_paths: >-
      {{
        (((__run_dovecot_external_manifest_slurp['content'] | ansible.builtin.default('')
           | ansible.builtin.b64decode | ansible.builtin.from_yaml)
          | ansible.builtin.default({}, true))['files'] | ansible.builtin.default([]))
      }}
    __run_dovecot_uninstall_master_users_path: >-
      {{ (run_dovecot_external_files['master_users'] | ansible.builtin.default({}, true))['path']
         | ansible.builtin.default(__run_dovecot_external_files_master_users_path_default, true) }}
    __run_dovecot_uninstall_quota_warning_path: >-
      {{ (run_dovecot_external_files['quota_warning_script'] | ansible.builtin.default({}, true))['path']
         | ansible.builtin.default(__run_dovecot_external_files_quota_warning_path_default, true) }}
  loop: >-
    {{
      ([
        __run_dovecot_dovecotconf_file_path,
        __run_dovecot_confd_tombstone_file_path,
        __run_dovecot_uninstall_master_users_path,
        __run_dovecot_uninstall_quota_warning_path,
        __run_dovecot_external_files_master_users_path_default,
        __run_dovecot_external_files_quota_warning_path_default,
        __run_dovecot_external_files_manifest_path
      ] + __run_dovecot_uninstall_manifest_paths) | ansible.builtin.unique
    }}


# Mail storage directory (and its contents) is deliberately NOT removed on
# uninstall: it almost always holds production user data. Operators who really
# want it gone have to delete it themselves; we do not want to be the role that
# wiped a mail spool on a state flip.
- name: "Setup | Uninstall | Default | Inform that the mail storage directory is preserved"
  ansible.builtin.debug:
    msg: >-
      The mail storage directory at {{ run_dovecot_mail_storage_path }} (and any
      user data within it) is intentionally NOT removed. If you really want it
      gone, delete it manually.
  when:
    - run_dovecot_mail_storage_path is ansible.builtin.defined


- name: "Setup | Uninstall | Default | Remove mail storage POSIX user (vmail)"
  ansible.builtin.user:
    name: "{{ run_dovecot_mail_user_name }}"
    state: "absent"
    remove: false # never delete the mail spool home directory
    force: false
  when:
    - run_dovecot_mail_user_manage | ansible.builtin.bool


- name: "Setup | Uninstall | Default | Remove mail storage POSIX group (vmail)"
  ansible.builtin.group:
    name: "{{ run_dovecot_mail_group_name }}"
    state: "absent"
  when:
    - run_dovecot_mail_user_manage | ansible.builtin.bool
