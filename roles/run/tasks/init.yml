# Initialization: Manage internal role setup and the Ansible environment.

---

- name: "Init | Gather role-specific facts"
  ansible.builtin.setup:
    gather_subset: "{{ __run_dovecot_used_facts.keys() | ansible.builtin.list }}"
  when:
    - not ((__run_dovecot_used_facts.values() | ansible.builtin.flatten)
           is ansible.builtin.subset(ansible_facts.keys()))


- name: "Init | Include role meta data"
  ansible.builtin.include_vars:
    file: "../meta/main.yml"
    name: "__run_dovecot_meta"


- name: "Init | Check Ansible version requirement and fail if unmet"
  ansible.builtin.fail:
    msg: >
      This role requires Ansible {{ __run_dovecot_meta['galaxy_info']['min_ansible_version'] }}
      or higher. You are currently running Ansible {{ ansible_version['full'] }} .
  when:
    - ansible_version['full'] is version_compare(__run_dovecot_meta['galaxy_info']['min_ansible_version'], '<')


- name: "Init | Notify when platform support check is not possible"
  ansible.builtin.debug:
    msg: >
      The list of supported platforms cannot be checked as it is either empty
      or distribution facts are missing.
    verbosity: 1
  when:
    - ansible_facts['os_family'] is not ansible.builtin.defined or
      ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['distribution_version'] is not ansible.builtin.defined or
      ansible_facts['distribution_major_version'] is not ansible.builtin.defined or
      ((__run_dovecot_supported_platforms | ansible.builtin.length) == 0)

# Unlike our other Ansible roles, the role will fail on unsupported platforms. This is
# intentional because Dovecot has specific requirements and version constraints.
- name: "Init | Fail when platform is unsupported"
  ansible.builtin.fail:
    msg: >
      Neither {{ ansible_facts['distribution'] }} (distribution) nor {{ ansible_facts['os_family'] }} (os_family)
      with versions '{{ ansible_facts['distribution_major_version'] }}', '{{ ansible_facts['distribution_version'] }}',
      or 'all' is in the list of supported platforms from vars/main.yml: {{ __run_dovecot_supported_platforms }}
  vars:
    __run_dovecot_platform_names_regex: >-
      ^({{ ansible_facts['distribution'] }}|{{ ansible_facts['os_family'] }})$
    __run_dovecot_platform_versions_regex: >-
      ^({{ ansible_facts['distribution_major_version'] }}|{{ ansible_facts['distribution_version'] }}|all)$
    __run_dovecot_matched_versions: >-
      {{
        __run_dovecot_supported_platforms
        | ansible.builtin.selectattr('name', 'match', __run_dovecot_platform_names_regex, ignorecase=true)
        | ansible.builtin.map(attribute='versions')
        | ansible.builtin.flatten
        | ansible.builtin.select('match', __run_dovecot_platform_versions_regex, ignorecase=true)
        | ansible.builtin.list
      }}
  when:
    - (__run_dovecot_supported_platforms | ansible.builtin.length) > 0
    - (__run_dovecot_matched_versions | ansible.builtin.length) == 0


- name: "Init | Set platform-specific filename list (most to least specific; raw with possible duplicates)"
  ansible.builtin.set_fact:
    __run_dovecot_platform_filenames_raw:
      - "{{ __run_dovecot_dist }}_{{ __run_dovecot_dist_ver }}.yml"
      - "{{ __run_dovecot_dist }}_{{ __run_dovecot_dist_major }}.yml"
      - "{{ __run_dovecot_dist }}.yml"
      - "{{ __run_dovecot_os_family }}.yml"
  vars:
    __run_dovecot_dist: >-
      {{
        ansible_facts['distribution']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_dovecot_dist_ver: >-
      {{
        ansible_facts['distribution_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_dovecot_dist_major: >-
      {{
        ansible_facts['distribution_major_version']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}
    __run_dovecot_os_family: >-
      {{
        ansible_facts['os_family']
        | ansible.builtin.regex_replace(' ', '_')
        | ansible.builtin.lower
      }}


- name: "Init | Set unique platform-specific filename list (most to least specific)"
  ansible.builtin.set_fact:
    __run_dovecot_platform_filenames_most_specific_first: >-
      {{
        (__run_dovecot_platform_filenames_raw
        | ansible.builtin.unique
        | ansible.builtin.default([]))
      }}


- name: "Init | Set unique platform-specific filename list (least to most specific)"
  ansible.builtin.set_fact:
    __run_dovecot_platform_filenames_most_specific_last: >-
      {{
        __run_dovecot_platform_filenames_most_specific_first
        | ansible.builtin.reverse
      }}


- name: "Init | Include platform-specific variables (if any), overwrite values with more specific ones"
  ansible.builtin.include_vars:
    file: "{{ __run_dovecot_vars_file }}"
  vars:
    __run_dovecot_vars_file: "{{ role_path }}/vars/{{ item }}"
  when:
    - __run_dovecot_vars_file is ansible.builtin.file
  loop: "{{ __run_dovecot_platform_filenames_most_specific_last }}"


## dovecot specific

# Dovecot 2.4 refuses any configuration in which dovecot_config_version is
# not the first setting or dovecot_storage_version is unset (verified with
# doveconf 2.4.1). Without this assert the run would only fail later, in the
# template's doveconf validation, with a less actionable error. The role
# deliberately does not guess the values: dovecot_storage_version pins the
# on-disk storage format and must never be bumped silently.
- name: "Init | Fail when the mandatory Dovecot version pins are missing from run_dovecot_settings"
  ansible.builtin.assert:
    that:
      - run_dovecot_settings['dovecot_config_version'] is ansible.builtin.defined
      - run_dovecot_settings['dovecot_storage_version'] is ansible.builtin.defined
    fail_msg: >-
      Dovecot 2.4 requires both "dovecot_config_version" and
      "dovecot_storage_version" to be set. Add them to "run_dovecot_settings",
      e.g. the Dovecot release your configuration is written for (like
      "2.4.0").
    quiet: true
  when:
    - run_dovecot_state == 'present'


- name: "Init | Fail when the upstream repository is requested on a platform it does not cover"
  ansible.builtin.assert:
    that:
      - __run_dovecot_repository_supported | ansible.builtin.bool
    fail_msg: >-
      run_dovecot_repository_manage is true, but the official Dovecot community
      repositories (repo.dovecot.org) do not provide packages for
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
      Set run_dovecot_repository_manage to false to use the default
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      repositories instead.
    quiet: true
  when:
    - run_dovecot_repository_manage | ansible.builtin.bool
