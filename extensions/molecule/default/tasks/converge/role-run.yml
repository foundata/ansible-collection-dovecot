# Execute the collection role "run" against all driver-created instances.

# The following task avoids fragile workarounds (like parsing container names)
# if facts are needed below (e.g. to derive the per-OS dummy certificate paths).
- name: "Molecule | Converge | Gather molecule playbook-specific facts"
  ansible.builtin.setup:
    gather_subset:
      - "distribution"
  when:
    - ansible_facts['distribution'] is not ansible.builtin.defined or
      ansible_facts['os_family'] is not ansible.builtin.defined


# These paths must match the dummy cert/key created in tasks/prepare/all.yml.
# They are stored in __testing_state below so the verify stage can re-use them
# without duplicating the per-OS path logic.
- name: "Molecule | Converge | Derive per-OS dummy TLS cert/key paths"
  ansible.builtin.set_fact:
    __testing_dovecot_ssl_cert_path: >-
      {{ ('/etc/pki/tls/certs' if (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat' else '/etc/ssl/certs')
         ~ '/dovecot-dummy-cert.pem' }}
    __testing_dovecot_ssl_key_path: >-
      {{ ('/etc/pki/tls/private' if (ansible_facts['os_family'] | ansible.builtin.lower) == 'redhat' else '/etc/ssl/private')
         ~ '/dovecot-dummy-key.pem' }}


# Self-contained passwd-file auth backend for the functional tests (real IMAP
# LOGIN over TLS + LMTP delivery). No external LDAP/SQL needed.
#
# Security Notice: These are NOT real credentials. This is example/test data.
# Reporting it as a leak reflects a failure to review automated scan results. ;-)
# Plaintext: MoleculeTest1234__   (hash: openssl passwd -6 -salt moltest01 ...)
- name: "Molecule | Converge | Define passwd-file and LDAP test identities"
  ansible.builtin.set_fact:
    # passwd-file user (password check + uid/gid/home from /etc/dovecot/users)
    __testing_dovecot_imap_user: "johndoe"
    __testing_dovecot_imap_password: "MoleculeTest1234__"
    __testing_dovecot_imap_password_hash: "{CRYPT}$6$moltest01$5yRZcN98Aow6VxIDKYULnZNnuG85SQMUKKzQrh2qtzYyXfrJIOPuz.Jr20kXrZHOAwwTK1.CFLHgE7oEElZ2F0"
    __testing_dovecot_user_home: "/srv/vmail/johndoe"
    __testing_dovecot_passwd_file: "/etc/dovecot/users"
    __testing_dovecot_lmtp_socket: "/run/dovecot/lmtp-test"
    # LDAP user (seeded into the localhost slapd by the prepare stage). Logs in
    # by falling through the passwd-file passdb (where it is unknown) to ldap.
    __testing_dovecot_ldap_user: "ldapuser"
    __testing_dovecot_ldap_password: "LdapTest1234__"


- name: "Molecule | Converge | Store run_dovecot_* role parameters in __testing_state"
  ansible.builtin.include_tasks:
    file: "../tasks/state_update.yml"
  vars:
    __testing_state_update:
      # Persist the dummy TLS cert/key paths so the verify stage can re-use them.
      __testing_dovecot_ssl_cert_path: "{{ __testing_dovecot_ssl_cert_path }}"
      __testing_dovecot_ssl_key_path: "{{ __testing_dovecot_ssl_key_path }}"

      # Persist the passwd-file test identity / socket for the verify stage.
      __testing_dovecot_imap_user: "{{ __testing_dovecot_imap_user }}"
      __testing_dovecot_imap_password: "{{ __testing_dovecot_imap_password }}"
      __testing_dovecot_user_home: "{{ __testing_dovecot_user_home }}"
      __testing_dovecot_lmtp_socket: "{{ __testing_dovecot_lmtp_socket }}"

      # Persist the LDAP test identity for the verify stage.
      __testing_dovecot_ldap_user: "{{ __testing_dovecot_ldap_user }}"
      __testing_dovecot_ldap_password: "{{ __testing_dovecot_ldap_password }}"

      # set all role configuration variables
      run_dovecot_state: "present"
      run_dovecot_autoupgrade: false
      run_dovecot_service_state: "enabled"

      # mail identity. UID/GID are deliberately set high to avoid colliding
      # with whatever resident the test image happens to ship at uid 1000
      # and to really test something odd
      run_dovecot_mail_user_manage: true
      run_dovecot_mail_user_name: "vmail"
      run_dovecot_mail_user_uid: 8000
      run_dovecot_mail_group_name: "vmail"
      run_dovecot_mail_group_gid: 8000
      run_dovecot_mail_storage_path: "/srv/vmail"

      # The settings dict deliberately exercises:
      # - protocols → triggers protocol-extras package install path
      #   (dovecot-{imapd,lmtpd,sieve,managesieved} on Debian; dovecot-pigeonhole on Fedora)
      # - per-protocol "protocol imap" block with mail_plugins → exercises the
      #   per-protocol plugin scanner in helper_list_extra_packages.j2
      # - nested blocks (namespace, service, inet/unix listener) → exercises the
      #   recursive render_settings() macro path
      # - scalar/dict mix on the same level + boolean + integer + list types
      #   → exercises every rendering branch in the macro
      run_dovecot_settings:
        dovecot_config_version: "2.4.0" # lowest common denominator across Debian 13 (2.4.0) and Fedora 4x (2.4.x)
        dovecot_storage_version: "2.4.0" # mandatory in 2.4 alongside dovecot_config_version
        protocols: "imap lmtp sieve"
        # TLS. Dovecot 2.4 renamed the SSL settings: ssl_cert/ssl_key (with a
        # leading "<") became ssl_server_cert_file/ssl_server_key_file taking a
        # plain filesystem path. The cert/key are the throwaway dummy material
        # created in tasks/prepare/all.yml.
        ssl: "yes"
        ssl_server_cert_file: "{{ __testing_dovecot_ssl_cert_path }}"
        ssl_server_key_file: "{{ __testing_dovecot_ssl_key_path }}"
        # Dovecot 2.4 renamed disable_plaintext_auth → auth_allow_cleartext
        # (inverted semantics); keep cleartext auth allowed so the STARTTLS check
        # is not forced into a TLS-only login.
        auth_allow_cleartext: true
        auth_mechanisms: "plain login"
        mail_driver: "maildir"
        mail_path: "~/Maildir"
        mail_home: "/srv/vmail/%{user}"
        first_valid_uid: 8000
        last_valid_uid: 8000
        # Boollist setting in the Dovecot 2.4 block form (a dict renders as
        # "mail_plugins { quota = yes }"); also covers the plugin->package scan.
        mail_plugins:
          quota: true
        log_path: "/var/log/dovecot.log"
        "namespace inbox":
          inbox: true
          separator: "/"
          prefix: ""
          "mailbox Drafts":
            auto: "subscribe"
            special_use: '\Drafts'
          "mailbox Sent":
            auto: "subscribe"
            special_use: '\Sent'
        "service imap-login":
          "inet_listener imap":
            port: 143 # plain IMAP + STARTTLS
          "inet_listener imaps":
            port: 993 # implicit TLS
            ssl: true
        "service lmtp":
          # Relative listener name -> socket lands at <base_dir>/lmtp-test
          # (/run/dovecot/lmtp-test). The verify stage speaks LMTP to it to
          # deliver a test message; 0666 lets the test client connect.
          "unix_listener lmtp-test":
            mode: "0666"
        "protocol imap":
          # Per-protocol boollist in block form; Dovecot merges it with the
          # global mail_plugins (no "$mail_plugins" needed in 2.4), so imap gets
          # quota + imap_quota.
          mail_plugins:
            imap_quota: true

        # LDAP connection (localhost slapd from the prepare stage), shared by the
        # ldap passdb/userdb below. Exercises the role's auth-backend package
        # install path too (dovecot-ldap on Debian; built-in on Fedora).
        ldap_uris: "ldap://127.0.0.1"
        ldap_auth_dn: "cn=admin,dc=example,dc=test"
        ldap_auth_dn_password: "AdminTest1234__"
        ldap_base: "dc=example,dc=test"
        ldap_scope: "subtree"

      # passwd-file backend: self-contained (no external LDAP/SQL) and, unlike
      # the "static" driver, lets the verify stage perform a real IMAP LOGIN and
      # LMTP delivery against an actual user. The same file feeds both passdb
      # (password check) and userdb (uid/gid/home). It is created after the role
      # runs (see "Create the passwd-file login database" task below).
      #
      # "name" is omitted so the block name defaults to the driver
      # (-> "passdb passwd-file {"); passwd_file_path is not driver-scoped, so
      # it resolves regardless.
      # Auth chain: passwd-file first (johndoe), then LDAP. A user unknown to the
      # passwd-file (ldapuser) falls through to the ldap passdb/userdb.
      run_dovecot_passdbs:
        - driver: "passwd-file"
          passwd_file_path: "/etc/dovecot/users"
        - driver: "ldap"
          passdb_ldap_bind: true
          passdb_ldap_filter: "(&(objectClass=inetOrgPerson)(uid=%{user}))"

      run_dovecot_userdbs:
        - driver: "passwd-file"
          passwd_file_path: "/etc/dovecot/users"
        - driver: "ldap"
          userdb_ldap_filter: "(&(objectClass=inetOrgPerson)(uid=%{user}))"
          # Force the shared vmail identity + storage path (the demo LDAP entry
          # has no posixAccount attributes on purpose).
          fields:
            uid: "vmail"
            gid: "vmail"
            home: "/srv/vmail/%{user}"

      # Exercise the external-files renderers (master_users + quota_warning_script).
      # The LDAP renderer is deliberately not exercised here, there is no local LDAP
      # server to validate against, and a syntax-only check would tell us nothing the
      # template can't already prove via doveconf -n.
      run_dovecot_external_files:
        master_users:
          enabled: true
          # default path is fine; leave it unset to exercise the role-default branch
          entries:
            - username: "admin"
              # not a realistic hash; we just verify the file is written verbatim
              password_hash: "{PLAIN}molecule-test-only"
        quota_warning_script:
          enabled: true
          path: "/usr/local/bin/dovecot-quota-warning.sh"
          from: "postmaster@example.com"
          subject: "Quota warning (${PERCENT}% full)"
          body: |
            EN: Your mailbox is now ${PERCENT}% full.
            DE: Ihr Postfach ist zu ${PERCENT}% belegt.

      # Exercise the verbatim-content escape hatch too.
      run_dovecot_settings_extra_content: |
        # === foundata.dovecot.run: molecule escape-hatch marker ===


- name: "Molecule | Converge | Set run_dovecot_* parameters as facts from __testing_state"
  ansible.builtin.set_fact:
    "{{ item['key'] }}": "{{ item['value'] }}"
  loop: >-
    {{
      (__testing_state | default({}, true))
      | ansible.builtin.dict2items
      | ansible.builtin.selectattr('key', 'match', '^run_dovecot_')
      | ansible.builtin.list
    }}


- name: "Molecule | Converge | Include the foundata.dovecot.run role"
  ansible.builtin.include_role:
    name: "foundata.dovecot.run"
  # vars: All run_dovecot* variables are set as facts and passed this way to
  #       the role. This enables persisting the values in __testing_state
  #       and restoring them in later stages (e.g. verify) without manually
  #       duplicating data across playbooks.


# Create the passwd-file login database the passdb/userdb above point at. This
# is test scaffolding (the role does not manage arbitrary user databases), done
# after the role so /etc/dovecot exists. Dovecot reads it per-auth, so no
# restart is needed. The fixed content keeps the idempotence run change-free.
# Fields: user:password:uid:gid:gecos:home:shell:extra_fields
- name: "Molecule | Converge | Create the passwd-file login database"
  ansible.builtin.copy:
    dest: "{{ __testing_dovecot_passwd_file }}"
    content: |
      {{ __testing_dovecot_imap_user }}:{{ __testing_dovecot_imap_password_hash }}:8000:8000::{{ __testing_dovecot_user_home }}::
    owner: "root"
    # The Dovecot auth process runs as the "dovecot" system user, so the
    # passdb/userdb file must be readable by that group, not root-only.
    group: "dovecot"
    mode: "u=rw,g=r,o=" # 0640, contains a password hash
