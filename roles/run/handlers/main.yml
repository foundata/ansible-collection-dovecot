# Handlers: Tasks that are triggered and run only when notified.

---

- name: "Handlers | Dovecot service restart"
  ansible.builtin.systemd_service:
    name: "{{ __run_dovecot_service_name }}"
    state: "restarted"
  when:
    - run_dovecot_service_state in ['enabled', 'running']
  listen:
    - "run_dovecot: restart dovecot.service"


# systemd refuses to reload an inactive service. On fresh installs the config
# handlers fire (handler flush after package installation) before the service
# phase has ever started Dovecot — skipping the reload is correct there: the
# service phase afterwards starts Dovecot with the new configuration.
- name: "Handlers | Gather service facts (reload pre-check)"
  ansible.builtin.service_facts:
  when:
    - run_dovecot_service_state in ['enabled', 'running']
  listen:
    - "run_dovecot: reload dovecot.service"


- name: "Handlers | Dovecot service reload"
  ansible.builtin.systemd_service:
    name: "{{ __run_dovecot_service_name }}"
    state: "reloaded"
  when:
    - run_dovecot_service_state in ['enabled', 'running']
    - (ansible_facts['services'][__run_dovecot_service_name]['state'] | ansible.builtin.default('')) == 'running'
  listen:
    - "run_dovecot: reload dovecot.service"
